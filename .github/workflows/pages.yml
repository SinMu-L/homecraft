# 每次 push、每天定时、或手动触发时：先同步博客文章，再构建并发布到 GitHub Pages。
# 仓库设置：Settings → Pages → Source: GitHub Actions
#          Settings → Secrets and variables → Actions → Variables: DEPLOY_PAGES = true
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # 每天 09:17（北京时间）拉一次博客，新文章自动上架
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync posts from the blog
        # 博客临时打不开时不要让整站挂掉：沿用仓库里上一次的 world/posts.js
        continue-on-error: true
        run: node tools/sync-blog.mjs
      - run: bash tools/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
