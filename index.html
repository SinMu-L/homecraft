<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fb2e8">
<!-- The world draws its own day and night. -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>极目的家</title>
<meta name="description" content="自动化工程师极目的方块小屋：书房里放着我的全部文章，按 F 可以打开博客。">
<meta property="og:type" content="website">
<meta property="og:title" content="极目的家">
<meta property="og:description" content="自动化工程师极目的方块小屋：书房里放着我的全部文章。">
<meta property="og:image" content="assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="engine/style.css">
<script type="importmap">{"imports":{
  "three":"./vendor/three/three.module.min.js",
  "@engine/":"./engine/",
  "@world/":"./world/",
  "@config":"./home.config.js"
}}</script>
</head>
<body>
<main id="world" aria-label="极目的家"></main>
<div id="loading"><div class="bar"><i></i></div></div>

<section id="pages">
  <h1 class="plain-title">极目的家</h1>

  <article class="page" data-station="library" data-icon="blog">
    <h2 data-zh="书架">Library</h2>
    <p data-zh="这里有我写过的全部文章。点标题在世界里打开，卡片右上角的 ↗ 看原文。">Everything I've written.</p>
    <ul class="store" id="post-list"></ul>
  </article>

  <article class="page" data-station="blog" data-icon="blog" data-embed="https://blog.sinmu.xyz/">
    <h2 data-zh="博客">Blog</h2>
    <p><a href="https://blog.sinmu.xyz/" target="_blank" rel="noopener">blog.sinmu.xyz ↗</a></p>
  </article>

  <article class="page" data-station="about">
    <h2 data-zh="关于我">About me</h2>
    <div class="about">
      <div class="about-text" lang="zh-CN">
        <p>自动化工程师，写 Python、折腾 AI 和 Web 逆向，顺便记录一些踩过的坑。</p>
        <div class="about-foot"><a class="mc-button" href="#contact" data-open="phone">关注</a><a class="mc-button" href="#mailbox" data-open="mailbox">留言</a></div>
      </div>
    </div>
  </article>

  <article class="page" id="contact" data-station="contact">
    <h2 data-zh="关注">Follow</h2>
    <ul class="contact">
      <li data-app="github"><span>GitHub</span><a href="https://github.com/SinMu-L" target="_blank" rel="noopener">SinMu-L</a><p data-zh="代码和小项目">代码和小项目</p></li>
      <li data-app="rss"><span>RSS</span><a href="https://blog.sinmu.xyz/rss.xml" target="_blank" rel="noopener">blog.sinmu.xyz/rss.xml</a><p data-zh="订阅博客">订阅博客</p></li>
    </ul>
  </article>

  <article class="page" id="mailbox" data-station="mailbox">
    <h2 data-zh="留言">Mailbox</h2>
    <form class="mailbox" method="post" enctype="text/plain">
      <textarea name="message" rows="6" maxlength="1000" required placeholder="输入文字" aria-label="输入文字" data-zh-placeholder="输入文字" data-zh-label="输入文字"></textarea>
      <input name="contact" maxlength="120" required autocomplete="email" placeholder="联系方式（必填，邮箱或微信等）" aria-label="联系方式，必填" data-zh-placeholder="联系方式（必填，邮箱或微信等）" data-zh-label="联系方式，必填">
      <input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="mailbox-foot"><button class="mc-button" type="submit" data-zh="发送">发送</button></div>
      <p class="mailbox-status" role="status" aria-live="polite"></p>
    </form>
  </article>
</section>

<!-- 用 world/posts.js 生成：书架目录 + 每篇文章一张内嵌卡片。必须排在 engine/main.js 之前。 -->
<script type="module">
  import posts from './world/posts.js';
  const pages = document.getElementById('pages');
  const list = document.getElementById('post-list');
  for (const p of posts) {
    const card = document.createElement('article');
    card.className = 'page';
    card.dataset.station = `post-${p.id}`;
    card.dataset.embed = p.url;
    const h2 = document.createElement('h2');
    h2.textContent = p.title;
    const meta = document.createElement('p');
    meta.textContent = `${p.date} · ${p.labels.join(' / ') || '随笔'}`;
    card.append(h2, meta);
    pages.append(card);

    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `#post-${p.id}`;
    a.dataset.open = `post-${p.id}`;
    a.textContent = p.title;
    const when = document.createElement('small');
    when.textContent = `  ${p.date}`;
    li.append(a, when);
    list.append(li);
  }
</script>

<!-- file:// cannot load the world modules. -->
<script>
if (location.protocol === 'file:') {
  const note = document.createElement('aside');
  note.id = 'startupNotice';
  note.innerHTML = '<h2>请用本地服务器打开</h2><p>直接双击打开时，浏览器不会加载 3D 世界。在这个文件夹里运行 <code>python tools/serve.py</code>，它会找一个空闲端口并自动打开页面。</p>';
  document.getElementById('pages').before(note);
  document.getElementById('loading')?.remove();
  document.body.classList.add('plain');
}
</script>
<noscript><style>#world,#hud,#loading{display:none}#pages{display:block}</style></noscript>
<script type="module" src="engine/main.js"></script>

<!-- 深链：文章页放 https://sinmu.xyz/?post=P23 就能直接飞到那篇文章的展位 -->
<script type="module">
  const post = new URLSearchParams(location.search).get('post');
  if (post) {
    let tries = 0;
    const timer = setInterval(() => {
      if (window.__home?.go) {
        clearInterval(timer);
        window.__home.go(`post-${post}`);
      } else if (++tries > 100) {
        clearInterval(timer);
      }
    }, 100);
  }
</script>
</body>
</html>
